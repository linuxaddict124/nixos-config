name: Monthly Release

on:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Compute version (YYYY-MM-DD)
        id: ver
        shell: bash
        run: |
          VERSION="$(date -u +'%Y-%m-%d')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Count commits since previous monthly tag
        id: commits
        shell: bash
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          CURRENT_TAG="$VERSION"
          PREV_TAG="$(git tag -l '[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]' \
            | grep -v "^${CURRENT_TAG}$" \
            | sort -r \
            | head -n 1)"
          echo "prev_tag=$PREV_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$PREV_TAG" ]; then
            COUNT="$(git rev-list --count HEAD)"
          else
            COUNT="$(git rev-list --count "${PREV_TAG}..HEAD")"
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create (or update) git tag and GitHub release
        if: ${{ steps.commits.outputs.count >= 5 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_TAG="${VERSION}"
          if ! git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
            git tag "$CURRENT_TAG"
            git push origin "$CURRENT_TAG"
          fi
          gh release create "$CURRENT_TAG" \
            --title "$VERSION" \
            --notes "Automated monthly release ($VERSION)" \
            --generate-notes \
            --prerelease
